name: Kids ISO input
on:
  push:
    paths: ['builder/**', 'configs/**', 'bin/omarchy-iso-make', 'test/unit/**', '.github/workflows/kids-input.yml']
  pull_request:
    paths: ['builder/**', 'configs/**', 'bin/omarchy-iso-make', 'test/unit/**', '.github/workflows/kids-input.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONPATH=test/unit python3 -m unittest test_child_profile test_kids_packages test_offline_mirror_pruning test_provisioning_state
      - run: bash -n bin/omarchy-iso-make bin/omarchy-iso-test builder/build-iso.sh configs/airootfs/root/configurator
